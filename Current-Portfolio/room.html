<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Jennifer's Studio · Portfolio</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0e0b08; overflow: hidden; font-family: 'Inter', -apple-system, sans-serif; }
    canvas { display: block; }
    body { cursor: grab; }
    body.dragging { cursor: grabbing; }
    body.hovering { cursor: pointer; }

    #back {
      position: fixed; top: 32px; left: 40px; z-index: 100;
      display: flex; align-items: center; gap: 8px;
      color: rgba(255,255,255,0.35); text-decoration: none;
      font-size: 13px; font-weight: 400; letter-spacing: 0.04em;
      transition: color 0.25s;
    }
    #back:hover { color: rgba(255,255,255,0.82); }

    #label {
      position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
      z-index: 100; font-size: 11px; font-weight: 400;
      letter-spacing: 0.18em; color: rgba(255,255,255,0.16);
      text-transform: uppercase; white-space: nowrap;
    }

    #hint {
      position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%);
      z-index: 100; font-size: 11px; letter-spacing: 0.08em;
      color: rgba(255,255,255,0.14); white-space: nowrap;
      transition: opacity 2s ease;
    }
    #hint.gone { opacity: 0; pointer-events: none; }

    #tip {
      position: fixed; z-index: 100; pointer-events: none;
      background: rgba(10,8,5,0.92); backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.065);
      border-radius: 10px; padding: 16px 20px; width: 252px;
      opacity: 0; transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
    }
    #tip.show { opacity: 1; transform: translateY(0); }
    #tip .tc { font-size: 10px; font-weight: 600; letter-spacing: 0.14em;
      color: rgba(255,255,255,0.28); text-transform: uppercase; margin-bottom: 6px; }
    #tip .tt { font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.88);
      margin-bottom: 7px; line-height: 1.3; }
    #tip .tb { font-size: 12px; line-height: 1.6; color: rgba(255,255,255,0.38); }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<canvas id="c"></canvas>

<a href="/index.html" id="back">
  <svg width="14" height="14" viewBox="0 0 14 14" fill="none">

          stroke-linecap="round" stroke-linejoin="round"/>

  Portfolio
</a>
<div id="label">Jennifer's Studio</div>
<div id="hint">Drag to explore &nbsp;&middot;&nbsp; Hover objects to discover</div>
<div id="tip">
  <div class="tc" id="tc"></div>
  <div class="tt" id="tt"></div>
  <div class="tb" id="tb"></div>
</div>

<script type="importmap">
{
  "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Renderer ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;

// ── Scene ─────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e0b08);
scene.fog = new THREE.FogExp2(0x0e0b08, 0.022);

// ── Camera & Controls ─────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.05, 40);
camera.position.set(4.2, 5.6, 5.4);

const controls = new OrbitControls(camera, canvas);
controls.target.set(-0.5, 1.1, -2.0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.minDistance = 2.5;
controls.maxDistance = 10;
controls.minPolarAngle = 0.15;
controls.maxPolarAngle = Math.PI * 0.44;
controls.minAzimuthAngle = -Math.PI * 0.45;
controls.maxAzimuthAngle = Math.PI * 0.38;
controls.update();

// ── Mesh helpers ──────────────────────────────────────────────────────────────
const std = o => new THREE.MeshStandardMaterial(o);
function mk(geo, mat, cast = true, recv = true) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = cast; m.receiveShadow = recv; return m;
}
const box  = (w, h, d, mat)      => mk(new THREE.BoxGeometry(w, h, d), mat);
const cyl  = (rt, rb, h, s, mat) => mk(new THREE.CylinderGeometry(rt, rb, h, s), mat);
const cone = (r, h, s, mat)      => mk(new THREE.ConeGeometry(r, h, s), mat);
const sph  = (r, ws, hs, mat)    => mk(new THREE.SphereGeometry(r, ws, hs), mat);
const pl   = (w, h, mat)         => mk(new THREE.PlaneGeometry(w, h), mat, false, true);

// ── Canvas texture helpers ─────────────────────────────────────────────────────
function rrect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y);
  g.arcTo(x + w, y, x + w, y + r, r);
  g.lineTo(x + w, y + h - r);
  g.arcTo(x + w, y + h, x + w - r, y + h, r);
  g.lineTo(x + r, y + h);
  g.arcTo(x, y + h, x, y + h - r, r);
  g.lineTo(x, y + r);
  g.arcTo(x, y, x + r, y, r);
  g.closePath(); g.fill();
}

// Monitor screen — Figma design tool / vAuto work
function makeMonitorTex() {
  const c = document.createElement('canvas'); c.width = 1280; c.height = 800;
  const g = c.getContext('2d');
  g.fillStyle = '#0d1117'; g.fillRect(0, 0, 1280, 800);
  g.fillStyle = '#161b22'; g.fillRect(0, 0, 1280, 44);
  [['#ff5f57',18],['#febc2e',40],['#28c841',62]].forEach(([col,x]) => {
    g.fillStyle = col; g.beginPath(); g.arc(x,22,7,0,Math.PI*2); g.fill();
  });
  g.fillStyle = '#21262d'; rrect(g,86,8,160,28,4);
  g.fillStyle = 'rgba(255,255,255,0.65)'; g.font = '600 12px system-ui'; g.fillText('vAuto TestDrive',98,26);
  g.fillStyle = 'rgba(255,255,255,0.14)'; rrect(g,254,8,120,28,4);
  g.fillStyle = 'rgba(255,255,255,0.32)'; g.font = '400 12px system-ui'; g.fillText('cloudServe',268,26);
  g.fillStyle = '#0d1117'; g.fillRect(0,44,222,756);
  g.fillStyle = 'rgba(255,255,255,0.22)'; g.font = '600 10px system-ui'; g.fillText('LAYERS',16,74);
  ['Frame · Beta Portal','  Nav Bar','  Hero Section','  Feature Cards','    AI Pricing Card','    Live Feed Card','    Deal Analyzer','  Feedback Banner','  Footer'].forEach((l,i) => {
    if (i===0){g.fillStyle='rgba(88,166,255,0.1)';g.fillRect(0,82+i*23,221,21);}
    g.fillStyle = i===0?'rgba(255,255,255,0.72)':'rgba(255,255,255,0.24)';
    g.font = (i===0?'500':'400')+' 11px monospace'; g.fillText(l,14,97+i*23);
  });
  g.fillStyle = '#1a1f27'; g.fillRect(222,44,778,756);
  g.fillStyle = 'rgba(255,255,255,0.03)';
  for(let x=242;x<1000;x+=20) for(let y=64;y<800;y+=20){g.beginPath();g.arc(x,y,1,0,Math.PI*2);g.fill();}
  g.fillStyle='rgba(0,0,0,0.38)'; rrect(g,258,68,684,582,3);
  g.fillStyle='#f4f4f6'; rrect(g,256,66,684,582,3);
  g.fillStyle='rgba(255,255,255,0.22)'; g.font='400 10px monospace'; g.fillText('Beta Portal · 1440 × 900',256,60);
  g.fillStyle='#111116'; g.fillRect(256,66,684,50);
  g.fillStyle='#fff'; g.font='700 14px system-ui'; g.fillText('vAuto',276,97);
  g.fillStyle='rgba(255,255,255,0.38)'; g.font='400 11px system-ui';
  ['Features','Feedback','Docs','Support'].forEach((t,i)=>g.fillText(t,364+i*74,97));
  g.fillStyle='#f0f0f3'; g.fillRect(256,116,684,112);
  g.fillStyle='#111116'; g.font='700 20px system-ui'; g.fillText('Beta Feature Program',276,150);
  g.fillStyle='#5a5a6a'; g.font='400 12px system-ui';
  g.fillText('Discover and enable features before GA — 220K+ dealer users.',276,170);
  g.fillStyle='#111116'; rrect(g,276,184,120,28,4);
  g.fillStyle='#fff'; g.font='500 11px system-ui'; g.fillText('Explore Features',288,202);
  g.fillStyle='#e8e8ec'; g.fillRect(256,236,684,404);
  g.fillStyle='#111116'; g.font='700 14px system-ui'; g.fillText('Available Beta Features',276,266);
  [{tag:'AI / ML',tagC:'#dce8ff',tagT:'#1a45cc',title:'Smart Pricing AI',sub:'Real-time ML-driven market pricing'},
   {tag:'Data',tagC:'#ffe8db',tagT:'#cc4a1a',title:'Live Market Feed',sub:'Regional inventory & demand data'},
   {tag:'Analytics',tagC:'#e8dbff',tagT:'#6a1acc',title:'Deal Analyzer',sub:'Predictive margin optimization'}
  ].forEach(({tag,tagC,tagT,title,sub},i)=>{
    const cx=276+i*216,cy=282,cw=206,ch=148;
    g.fillStyle='#ffffff'; g.shadowColor='rgba(0,0,0,0.06)'; g.shadowBlur=10;
    rrect(g,cx,cy,cw,ch,6); g.shadowBlur=0;
    g.fillStyle=tagC; rrect(g,cx+12,cy+12,54,17,8);
    g.fillStyle=tagT; g.font='600 9px system-ui'; g.fillText(tag,cx+19,cy+24);
    g.fillStyle='#111116'; g.font='600 12px system-ui'; g.fillText(title,cx+12,cy+50);
    g.fillStyle='#66666f'; g.font='400 10px system-ui'; g.fillText(sub,cx+12,cy+68);
    g.fillStyle='#1aaa3a'; g.beginPath(); g.arc(cx+17,cy+106,4,0,Math.PI*2); g.fill();
    g.fillStyle='#444'; g.font='400 10px system-ui'; g.fillText('Active',cx+27,cy+110);
    g.fillStyle='#111116'; rrect(g,cx+12,cy+122,76,16,3);
    g.fillStyle='#fff'; g.font='500 9px system-ui'; g.fillText('Enable Now',cx+18,cy+134);
  });
  g.fillStyle='#161b22'; g.fillRect(1000,44,280,756);
  g.fillStyle='rgba(255,255,255,0.3)'; g.font='600 10px system-ui'; g.fillText('DESIGN',1020,72);
  [['Width','684'],['Height','582'],['X','256'],['Y','66'],['Fill','#F4F4F6'],['Radius','3'],['Opacity','100%']].forEach(([k,v],i)=>{
    g.fillStyle='rgba(255,255,255,0.22)'; g.font='400 11px monospace'; g.fillText(k,1020,96+i*26);
    g.fillStyle='rgba(255,255,255,0.58)'; g.fillText(v,1102,96+i*26);
  });
  return new THREE.CanvasTexture(c);
}

// Wall art texture
function makeWallArtTex() {
  const c = document.createElement('canvas'); c.width = 600; c.height = 380;
  const g = c.getContext('2d');
  g.fillStyle = '#100c08'; g.fillRect(0,0,600,380);
  const grad = g.createLinearGradient(0,0,600,380);
  grad.addColorStop(0,'rgba(180,120,60,0.12)'); grad.addColorStop(1,'rgba(80,60,40,0.06)');
  g.fillStyle = grad; g.fillRect(0,0,600,380);
  g.strokeStyle = 'rgba(255,220,160,0.08)'; g.lineWidth = 0.5;
  for(let x=0;x<600;x+=30){g.beginPath();g.moveTo(x,0);g.lineTo(x,380);g.stroke();}
  for(let y=0;y<380;y+=30){g.beginPath();g.moveTo(0,y);g.lineTo(600,y);g.stroke();}
  g.strokeStyle='rgba(220,180,120,0.22)'; g.lineWidth=0.7;
  g.beginPath(); g.moveTo(140,130); g.lineTo(460,130); g.stroke();
  g.fillStyle='rgba(255,240,210,0.88)'; g.font='300 46px Georgia, serif'; g.textAlign='center';
  g.fillText('Jennifer Flores',300,200);
  g.fillStyle='rgba(220,180,120,0.55)'; g.font='400 12px system-ui';
  g.fillText('UX  ·  UI  ·  PRODUCT DESIGN',300,230);
  g.strokeStyle='rgba(220,180,120,0.12)'; g.lineWidth=0.7;
  g.beginPath(); g.moveTo(140,248); g.lineTo(460,248); g.stroke();
  g.fillStyle='rgba(255,230,180,0.22)'; g.font='400 11px monospace'; g.fillText('2026',300,268);
  return new THREE.CanvasTexture(c);
}

// Sticky note texture
function makeStickyTex(text, bgColor) {
  const c = document.createElement('canvas'); c.width=256; c.height=256;
  const g = c.getContext('2d');
  g.fillStyle = bgColor; g.fillRect(0,0,256,256);
  g.fillStyle = 'rgba(0,0,0,0.07)'; g.fillRect(0,248,256,8);
  g.fillStyle = 'rgba(0,0,0,0.52)'; g.font='700 28px system-ui';
  g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,128,128);
  return new THREE.CanvasTexture(c);
}

// ── Lighting ──────────────────────────────────────────────────────────────────
// Very dim warm ambient
scene.add(new THREE.AmbientLight(0x1a1208, 3.8));

// Warm directional key — upper right
const key = new THREE.DirectionalLight(0xfff0d0, 0.9);
key.position.set(6, 8, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -10; key.shadow.camera.right = 10;
key.shadow.camera.top = 10; key.shadow.camera.bottom = -10;
key.shadow.camera.near = 0.5; key.shadow.camera.far = 30;
key.shadow.bias = -0.0005;
scene.add(key);

// Cool dim fill from front-left
const fill = new THREE.DirectionalLight(0x8899bb, 0.22);
fill.position.set(-4, 3, 6);
scene.add(fill);

// Window spotlight — warm light pouring through back-wall window
const winPt = new THREE.PointLight(0xfff5d8, 7.5, 7.5, 1.6);
winPt.position.set(1.0, 3.8, -4.5);
winPt.castShadow = true;
winPt.shadow.mapSize.set(512, 512);
scene.add(winPt);

// Monitor glow — blue
const monPt = new THREE.PointLight(0x4466ee, 1.8, 2.8, 2);
monPt.position.set(-1, 1.7, -2.8);
scene.add(monPt);

// Smiski glow — defined with geometry below, light added here
const skPt = new THREE.PointLight(0xaaffcc, 5.5, 3.8, 2);
skPt.position.set(-3.0, 1.08, -3.4);
scene.add(skPt);

// ── Materials ─────────────────────────────────────────────────────────────────
const mWall    = std({ color: 0x1c1208, roughness: 0.97 });          // dark warm brown
const mFloor   = std({ color: 0xcfc3a4, roughness: 0.88 });          // warm cream/beige
const mDesk    = std({ color: 0xeae6de, roughness: 0.55, metalness: 0.02 }); // white desk
const mDeskLeg = std({ color: 0x080808, roughness: 0.55 });          // black metal legs
const mMetal   = std({ color: 0x7a7a7a, roughness: 0.2, metalness: 0.92 });
const mDark    = std({ color: 0x0e0e0e, roughness: 0.85 });
const mLeather = std({ color: 0x0e0b0b, roughness: 0.88 });
const mShelf   = std({ color: 0xe2dbd2, roughness: 0.82 });
const mCurtain = std({ color: 0xf0e8d8, roughness: 0.92, side: THREE.DoubleSide });

// ── Room ──────────────────────────────────────────────────────────────────────
// Floor — warm cream
const floor = pl(16, 14, mFloor); floor.rotation.x = -Math.PI / 2; scene.add(floor);

// Back wall — dark warm brown
const bkW = pl(16, 7, mWall); bkW.position.set(0, 3.5, -5.6); scene.add(bkW);

// Left wall — dark warm brown, slightly lighter vertical panel texture via a second overlay
const lfW = pl(14, 7, mWall); lfW.position.set(-6.5, 3.5, 0); lfW.rotation.y = Math.PI / 2; scene.add(lfW);

// Ceiling
const ceil = pl(16, 14, std({ color: 0x0c0906, roughness: 0.98 }));
ceil.rotation.x = Math.PI / 2; ceil.position.y = 5.8; scene.add(ceil);

// Baseboards
const bbM = std({ color: 0x2a1e10, roughness: 0.90 });
const bbB = box(16, 0.1, 0.03, bbM); bbB.position.set(0, 0.05, -5.57); scene.add(bbB);
const bbL = box(0.03, 0.1, 14, bbM); bbL.position.set(-6.47, 0.05, 0); scene.add(bbL);

// ── Back-wall window with curtains ────────────────────────────────────────────
const winG = new THREE.Group(); winG.position.set(1.2, 2.55, -5.57); scene.add(winG);

// Dark glass (nighttime)
const mGlass = std({ color: 0x080c10, roughness: 0.05, metalness: 0.35, transparent: true, opacity: 0.9, side: THREE.DoubleSide });
const winPane = pl(1.5, 1.55, mGlass); winG.add(winPane);

// Window frame — dark brown wood
const mWinFr = std({ color: 0x2a1c0c, roughness: 0.75 });
// outer frame
[[-0.79, 0, 0.035, 1.62, 0.06],[0.79, 0, 0.035, 1.62, 0.06],  // sides
 [0, 0.84, 1.62, 0.06, 0.035],[0, -0.84, 1.62, 0.06, 0.035],  // top/bottom
 [0, 0, 1.62, 0.03, 0.035]                                      // center mullion
].forEach(([x,y,w,h,d]) => {
  const f = box(w, h, d, mWinFr); f.position.set(x, y, 0.018); winG.add(f);
});

// Curtain rod (above window)
const rod = cyl(0.012, 0.012, 2.4, 8, std({ color: 0x4a3820, roughness: 0.5, metalness: 0.3 }));
rod.rotation.z = Math.PI / 2; rod.position.set(0, 0.98, 0.06); winG.add(rod);
// Rod rings
[-0.96, -0.55, -0.14, 0.14, 0.55, 0.96].forEach(x => {
  const ring = cyl(0.016, 0.016, 0.035, 8, std({ color: 0x6a5030, roughness: 0.4, metalness: 0.4 }));
  ring.position.set(x, 0.96, 0.06); winG.add(ring);
});
// Curtain panels — two sides
[-1.05, 1.05].forEach(x => {
  const panel = box(0.55, 1.85, 0.022, mCurtain);
  panel.position.set(x, -0.04, 0.06); winG.add(panel);
  // Subtle fold crease
  const crease = box(0.008, 1.85, 0.012, std({ color: 0xd8cebb, roughness: 0.9, side: THREE.DoubleSide }));
  crease.position.set(x * 0.6, -0.04, 0.07); winG.add(crease);
});

// ── Desk ──────────────────────────────────────────────────────────────────────
const deskG = new THREE.Group(); scene.add(deskG);
// White desk surface
const dTop = box(3.7, 0.055, 1.85, mDesk); dTop.position.set(-1, 0.775, -2.5); deskG.add(dTop);
// Thin black A-frame legs
[[-2.8, -3.42], [-2.8, -1.58], [0.8, -3.42], [0.8, -1.58]].forEach(([x, z]) => {
  const leg = box(0.045, 0.775, 0.045, mDeskLeg); leg.position.set(x, 0.387, z); deskG.add(leg);
});
// Cross bar
const stretcher = box(3.58, 0.03, 0.03, mDeskLeg); stretcher.position.set(-1, 0.38, -3.42); deskG.add(stretcher);

// ── Monitor ───────────────────────────────────────────────────────────────────
const monTex  = makeMonitorTex();
const mFrame  = std({ color: 0x080808, roughness: 0.28, metalness: 0.5 });
const mScreen = std({ map: monTex, emissive: new THREE.Color(0x1a2640), emissiveIntensity: 0.12, roughness: 0.12 });
const standBase  = cyl(0.22, 0.26, 0.02, 32, mMetal); standBase.position.set(-1, 0.813, -3.12); scene.add(standBase);
const standNeck  = cyl(0.016, 0.016, 0.45, 12, mMetal); standNeck.position.set(-1, 1.04, -3.12); scene.add(standNeck);
const standHinge = box(0.08, 0.1, 0.025, mMetal); standHinge.position.set(-1, 1.29, -3.12); scene.add(standHinge);
const screenFrame = box(2.12, 1.22, 0.038, mFrame); screenFrame.position.set(-1, 1.72, -3.10); scene.add(screenFrame);
const screenMesh  = box(1.98, 1.1, 0.005, mScreen); screenMesh.position.set(-1, 1.72, -3.08); scene.add(screenMesh);

// ── Laptop on stand (left of monitor) ─────────────────────────────────────────
const laptopG = new THREE.Group(); laptopG.position.set(-2.38, 0.803, -2.7); scene.add(laptopG);
const mSilver = std({ color: 0x9aa0a6, roughness: 0.18, metalness: 0.88 });
const lapBase  = box(0.36, 0.012, 0.26, mSilver); lapBase.position.y = 0.006; laptopG.add(lapBase);
// Keys
const mLKey = std({ color: 0x787e84, roughness: 0.4, metalness: 0.5 });
for (let r = 0; r < 3; r++) for (let cc = 0; cc < 10; cc++) {
  const k = box(0.024, 0.004, 0.02, mLKey);
  k.position.set(-0.125 + cc * 0.028, 0.014, -0.08 + r * 0.028); laptopG.add(k);
}
// Lid
const lapScrG = new THREE.Group(); lapScrG.position.set(0, 0.012, -0.13); laptopG.add(lapScrG);
lapScrG.rotation.x = -Math.PI * 0.35;
const lapLid  = box(0.36, 0.008, 0.245, mSilver); lapLid.position.set(0, 0.004, -0.12); lapScrG.add(lapLid);
const mLapScr = std({ color: 0x1a2240, roughness: 0.1, emissive: new THREE.Color(0x2210aa), emissiveIntensity: 0.08 });
const lapScreen = box(0.33, 0.005, 0.228, mLapScr); lapScreen.position.set(0, 0.009, -0.12); lapScrG.add(lapScreen);

// ── Keyboard ──────────────────────────────────────────────────────────────────
const mKb  = std({ color: 0x1a1a1a, roughness: 0.5, metalness: 0.3 });

// ── Raycasting & hover ────────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const pointer   = new THREE.Vector2(-9, -9);
const tipEl = document.getElementById('tip');
const tcEl  = document.getElementById('tc');
const ttEl  = document.getElementById('tt');
const tbEl  = document.getElementById('tb');
let activeMesh = null;

window.addEventListener('mousemove', e => {
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  tipEl.style.left = Math.min(e.clientX + 22, innerWidth  - 274) + 'px';
  tipEl.style.top  = Math.min(e.clientY - 8,  innerHeight - 150) + 'px';
});
canvas.addEventListener('mousedown', () => document.body.classList.add('dragging'));
window.addEventListener('mouseup',   () => document.body.classList.remove('dragging'));

const hint = document.getElementById('hint');
let hinted = false;
controls.addEventListener('change', () => {
  if (!hinted) { hinted = true; setTimeout(() => hint.classList.add('gone'), 2800); }
});

// ── Animate ───────────────────────────────────────────────────────────────────
const iMeshes = interactives.map(h => h.mesh);

function animate() {
  requestAnimationFrame(animate);
  controls.update();

  // Head tracking — figure faces camera so natural sign direction
  figHead.rotation.y += (pointer.x * 0.52 - figHead.rotation.y) * 0.06;
  figHead.rotation.x += (-pointer.y * 0.22 - figHead.rotation.x) * 0.06;

  // Hover detection
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(iMeshes);
  if (hits.length > 0) {
    const found = interactives.find(h => h.mesh === hits[0].object);
    if (found && found.mesh !== activeMesh) {
      if (activeMesh) {
        const prev = interactives.find(h => h.mesh === activeMesh);
        if (prev) { activeMesh.material.emissive.copy(prev.origE); activeMesh.material.emissiveIntensity = prev.origEI; }
      }
      activeMesh = found.mesh;
      activeMesh.material.emissive.copy(found.hoverE);
      activeMesh.material.emissiveIntensity = found.hoverEI;
      tcEl.textContent = found.cat;
      ttEl.textContent = found.title;
      tbEl.textContent = found.body;
      tipEl.classList.add('show');
      document.body.classList.add('hovering');
    }
  } else {
    if (activeMesh) {
      const prev = interactives.find(h => h.mesh === activeMesh);
      if (prev) { activeMesh.material.emissive.copy(prev.origE); activeMesh.material.emissiveIntensity = prev.origEI; }
      activeMesh = null;
    }
    tipEl.classList.remove('show');
    document.body.classList.remove('hovering');
  }

  renderer.render(scene, camera);
}
animate();

// ── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
