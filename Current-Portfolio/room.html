<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Jennifer's Studio · Portfolio</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #080608; overflow: hidden; font-family: 'Inter', -apple-system, sans-serif; }
    canvas { display: block; }
    body { cursor: grab; }
    body.dragging { cursor: grabbing; }
    body.hovering { cursor: pointer; }

    #back {
      position: fixed; top: 32px; left: 40px; z-index: 100;
      display: flex; align-items: center; gap: 8px;
      color: rgba(255,255,255,0.35); text-decoration: none;
      font-size: 13px; font-weight: 400; letter-spacing: 0.04em;
      transition: color 0.25s;
    }
    #back:hover { color: rgba(255,255,255,0.82); }

    #label {
      position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
      z-index: 100; font-size: 11px; font-weight: 400;
      letter-spacing: 0.18em; color: rgba(255,255,255,0.16);
      text-transform: uppercase; white-space: nowrap;
    }

    #hint {
      position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%);
      z-index: 100; font-size: 11px; letter-spacing: 0.08em;
      color: rgba(255,255,255,0.14); white-space: nowrap;
      transition: opacity 2s ease;
    }
    #hint.gone { opacity: 0; pointer-events: none; }

    #tip {
      position: fixed; z-index: 100; pointer-events: none;
      background: rgba(8,8,10,0.92); backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.065);
      border-radius: 10px; padding: 16px 20px; width: 252px;
      opacity: 0; transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
    }
    #tip.show { opacity: 1; transform: translateY(0); }
    #tip .tc { font-size: 10px; font-weight: 600; letter-spacing: 0.14em;
      color: rgba(255,255,255,0.28); text-transform: uppercase; margin-bottom: 6px; }
    #tip .tt { font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.88);
      margin-bottom: 7px; line-height: 1.3; }
    #tip .tb { font-size: 12px; line-height: 1.6; color: rgba(255,255,255,0.38); }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Renderer ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

// ── Scene ─────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080608);
scene.fog = new THREE.FogExp2(0x080608, 0.028);

// ── Camera & Controls ─────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.05, 40);
camera.position.set(5.5, 4.2, 5.8);

const controls = new OrbitControls(camera, canvas);
controls.target.set(-0.5, 1.4, -2);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.minDistance = 2;
controls.maxDistance = 9.5;
controls.minPolarAngle = 0.06;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minAzimuthAngle = -Math.PI * 0.52;
controls.maxAzimuthAngle = Math.PI * 0.42;
controls.update();

// ── Mesh helpers ──────────────────────────────────────────────────────────────
const std = o => new THREE.MeshStandardMaterial(o);

function mk(geo, mat, cast = true, recv = true) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = cast;
  m.receiveShadow = recv;
  return m;
}
const box  = (w, h, d, mat)      => mk(new THREE.BoxGeometry(w, h, d), mat);
const cyl  = (rt, rb, h, s, mat) => mk(new THREE.CylinderGeometry(rt, rb, h, s), mat);
const cone = (r, h, s, mat)      => mk(new THREE.ConeGeometry(r, h, s), mat);
const sph  = (r, ws, hs, mat)    => mk(new THREE.SphereGeometry(r, ws, hs), mat);
const pl   = (w, h, mat)         => mk(new THREE.PlaneGeometry(w, h), mat, false, true);

// ── Canvas texture helpers ─────────────────────────────────────────────────────
function rrect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y);
  g.arcTo(x + w, y,   x + w, y + r,   r);
  g.lineTo(x + w, y + h - r);
  g.arcTo(x + w, y + h, x + w - r, y + h, r);
  g.lineTo(x + r, y + h);
  g.arcTo(x, y + h, x, y + h - r, r);
  g.lineTo(x, y + r);
  g.arcTo(x, y, x + r, y, r);
  g.closePath(); g.fill();
}

  g.fillStyle = '#e8e8ec'; g.fillRect(256, 236, 684, 404);

  cards.forEach(({ tag, tagC, tagT, title, sub }, i) => {

    g.fillStyle = '#444'; g.font = '400 10px system-ui'; g.fillText('Active', cx + 27, cy + 110);
    g.fillStyle = '#111116'; rrect(g, cx + 12, cy + 122, 76, 16, 3);

  });
  g.fillStyle = '#161b22'; g.fillRect(1000, 44, 280, 756);
  g.fillStyle = 'rgba(255,255,255,0.3)'; g.font = '600 10px system-ui'; g.fillText('DESIGN', 1020, 72);
  [['Width','684'],['Height','582'],['X','256'],['Y','66'],['Fill','#F4F4F6'],['Radius','3'],['Opacity','100%']
  ].forEach(([k, v], i) => {
    g.fillStyle = 'rgba(255,255,255,0.22)'; g.font = '400 11px monospace'; g.fillText(k, 1020, 96 + i * 26);
    g.fillStyle = 'rgba(255,255,255,0.58)'; g.fillText(v, 1102, 96 + i * 26);

  return new THREE.CanvasTexture(c);

// Laptop screen texture
function makeLaptopTex() {
  const c = document.createElement('canvas');
  c.width = 800; c.height = 500;
  const g = c.getContext('2d');
  g.fillStyle = '#1a1225'; g.fillRect(0, 0, 800, 500);
  g.fillStyle = '#2a1f3d'; g.fillRect(0, 0, 800, 38);
  g.fillStyle = 'rgba(255,255,255,0.5)'; g.font = '500 11px system-ui';
  g.fillText('Figma — Jennifer Flores Portfolio', 20, 24);
  g.fillStyle = '#12101a'; g.fillRect(0, 38, 180, 462);
  g.fillStyle = 'rgba(255,255,255,0.18)'; g.font = '600 9px system-ui';
  g.fillText('PAGES', 14, 62);

    if (i === 0) { g.fillStyle = 'rgba(150,100,255,0.18)'; g.fillRect(0, 72 + i * 26, 180, 22); }

    g.fillText(p, 14, 87 + i * 26);
  });
  g.fillStyle = '#1e1830'; g.fillRect(180, 38, 620, 462);
  g.fillStyle = 'rgba(255,255,255,0.02)';
  for (let x = 195; x < 800; x += 18) for (let y = 50; y < 500; y += 18) {
    g.beginPath(); g.arc(x, y, 0.8, 0, Math.PI * 2); g.fill();
  }
  g.fillStyle = '#f5f0ff'; rrect(g, 210, 60, 560, 380, 6);
  g.fillStyle = '#6b21a8'; g.fillRect(210, 60, 560, 56);
  g.fillStyle = '#fff'; g.font = '700 16px system-ui'; g.fillText('Jennifer Flores', 234, 94);
  g.fillStyle = 'rgba(255,255,255,0.55)'; g.font = '400 10px system-ui';
  g.fillText('UX · UI · Product Design', 234, 110);
  g.fillStyle = '#ede8f8'; g.fillRect(210, 116, 560, 324);
  g.fillStyle = '#3b0764'; g.font = '700 14px system-ui'; g.fillText('Selected Work', 234, 148);
  [[234, 168, 240, 130, '#d8b4fe','vAuto TestDrive'], [492, 168, 240, 130, '#bfdbfe','cloudServe']].forEach(([x, y, w, h, bg, label]) => {
    g.fillStyle = bg; rrect(g, x, y, w, h, 4);

// Wall art texture
function makeWallArtTex() {
  const c = document.createElement('canvas');
  c.width = 600; c.height = 380;
  const g = c.getContext('2d');
  g.fillStyle = '#0a0812'; g.fillRect(0, 0, 600, 380);
  const grad = g.createLinearGradient(0, 0, 600, 380);
  grad.addColorStop(0, 'rgba(120,60,180,0.12)');
  grad.addColorStop(1, 'rgba(60,120,200,0.08)');
  g.fillStyle = grad; g.fillRect(0, 0, 600, 380);
  g.strokeStyle = 'rgba(255,255,255,0.04)'; g.lineWidth = 0.5;
  for (let x = 0; x < 600; x += 30) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 380); g.stroke(); }
  for (let y = 0; y < 380; y += 30) { g.beginPath(); g.moveTo(0, y); g.lineTo(600, y); g.stroke(); }
  g.strokeStyle = 'rgba(180,140,255,0.18)'; g.lineWidth = 0.6;
  g.beginPath(); g.moveTo(140, 130); g.lineTo(460, 130); g.stroke();
  g.fillStyle = 'rgba(255,255,255,0.88)';
  g.font = '300 46px Georgia, serif'; g.textAlign = 'center';
  g.fillText('Jennifer Flores', 300, 200);
  g.fillStyle = 'rgba(180,140,255,0.55)'; g.font = '400 12px system-ui';
  g.fillText('UX  ·  UI  ·  PRODUCT DESIGN', 300, 230);
  g.strokeStyle = 'rgba(180,140,255,0.12)'; g.lineWidth = 0.6;
  g.beginPath(); g.moveTo(140, 248); g.lineTo(460, 248); g.stroke();
  g.fillStyle = 'rgba(255,255,255,0.18)'; g.font = '400 11px monospace';
  g.fillText('2026', 300, 268);
  return new THREE.CanvasTexture(c);
}

// Sticky note texture
function makeStickyTex(text, bgColor) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = bgColor; g.fillRect(0, 0, 256, 256);
  g.fillStyle = 'rgba(0,0,0,0.07)'; g.fillRect(0, 248, 256, 8);
  g.fillStyle = 'rgba(0,0,0,0.52)'; g.font = '700 28px system-ui';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 128, 128);
  return new THREE.CanvasTexture(c);
}

// Window glass texture — sky gradient
function makeWindowTex() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 400;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 400);
  grad.addColorStop(0,   '#b8d8f0');
  grad.addColorStop(0.4, '#d0e8f8');
  grad.addColorStop(1,   '#f0f4e8');
  g.fillStyle = grad; g.fillRect(0, 0, 256, 400);
  // subtle clouds
  g.fillStyle = 'rgba(255,255,255,0.55)';
  [[60, 80, 50, 22], [120, 60, 70, 25], [180, 95, 45, 18]].forEach(([x, y, rx, ry]) => {
    g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill();
  });
  return new THREE.CanvasTexture(c);
}

// ── Lighting ──────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x1a1020, 4.5));

// Warm key from upper right
const key = new THREE.DirectionalLight(0xfff2d8, 1.1);
key.position.set(7, 8, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -10; key.shadow.camera.right = 10;
key.shadow.camera.top  =  10; key.shadow.camera.bottom = -10;
key.shadow.camera.near = 0.5; key.shadow.camera.far = 32;
key.shadow.bias = -0.0005;
scene.add(key);

// Cool fill from left (mimics window daylight)

fill.position.set(-8, 5, 0);
scene.add(fill);

// Desk lamp — warm amber

lampPt.position.set(-3.0, 2.0, -3.45);
lampPt.castShadow = true;
lampPt.shadow.mapSize.set(512, 512);
scene.add(lampPt);

monPt.position.set(-1, 1.7, -2.8);
scene.add(monPt);

// Window daylight points — warm sunlight from outside left wall

winPt1.position.set(-5.8, 3.0, -0.8);
scene.add(winPt1);
const winPt2 = new THREE.PointLight(0xfff5e0, 3.2, 6, 1.8);
winPt2.position.set(-5.8, 3.0, -2.5);
scene.add(winPt2);

// ── Materials ─────────────────────────────────────────────────────────────────
const mWall    = std({ color: 0x1a1218, roughness: 0.96 });
const mWallWrm = std({ color: 0x1e1614, roughness: 0.94 }); // back wall — warmer tint
const mFloor   = std({ color: 0x0e0a0c, roughness: 0.90 });
const mDesk    = std({ color: 0x1a1008, roughness: 0.62, metalness: 0.05 });
const mDeskLeg = std({ color: 0x130c04, roughness: 0.7 });
const mMetal   = std({ color: 0x7a7a7a, roughness: 0.2, metalness: 0.92 });
const mDark    = std({ color: 0x0e0e0e, roughness: 0.85 });
const mLeather = std({ color: 0x100d0d, roughness: 0.88 });
const mShelf   = std({ color: 0xe2dbd2, roughness: 0.82 });

// ── Room ──────────────────────────────────────────────────────────────────────
const floor = pl(16, 14, mFloor); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const bkW = pl(16, 7, mWallWrm); bkW.position.set(0, 3.5, -5.6); scene.add(bkW);
const lfW = pl(14, 7, mWall); lfW.position.set(-6.5, 3.5, 0); lfW.rotation.y = Math.PI / 2; scene.add(lfW);
const ceil = pl(16, 14, std({ color: 0x0b0810, roughness: 0.98 }));
ceil.rotation.x = Math.PI / 2; ceil.position.y = 5.8; scene.add(ceil);

// Baseboards
const bbM = std({ color: 0x221e1e, roughness: 0.92 });
const bbB = box(16, 0.1, 0.03, bbM); bbB.position.set(0, 0.05, -5.57); scene.add(bbB);
const bbL = box(0.03, 0.1, 14, bbM); bbL.position.set(-6.47, 0.05, 0); scene.add(bbL);

// ── Windows (left wall, X = -6.5) ────────────────────────────────────────────
const winTex = makeWindowTex();
const mWinGlass = std({ map: winTex, transparent: true, opacity: 0.22, roughness: 0.04, metalness: 0.1, side: THREE.DoubleSide });
const mWinFrame = std({ color: 0x2a2420, roughness: 0.6, metalness: 0.08 });

[{ z: -0.8 }, { z: -2.5 }].forEach(({ z }) => {
  const wG = new THREE.Group(); wG.position.set(-6.48, 2.6, z); wG.rotation.y = Math.PI / 2; scene.add(wG);
  // glass pane
  const glass = pl(0.9, 1.4, mWinGlass); glass.position.x = 0; wG.add(glass);
  // frame rails
  const fMat = mWinFrame;
  [[-0.46, 0, 0.03, 1.4, 0.04], [0.46, 0, 0.03, 1.4, 0.04],  // sides
   [0, 0.71, 0.9, 0.03, 0.04], [0, -0.71, 0.9, 0.03, 0.04],  // top/bottom
   [0, 0, 0.9, 0.03, 0.04]                                    // center mullion
  ].forEach(([x, y, w, h, d]) => {
    const f = box(w, h, d, fMat); f.position.set(x, y, 0.02); wG.add(f);
  });
  // sill
  const sill = box(0.06, 0.04, 1.02, std({ color: 0x3a3028, roughness: 0.7 })); sill.position.set(0.025, -0.73, 0); wG.add(sill);
});

// ── Desk ─────────────────────────────────────────────────────────────────────

  {
    mesh: figHit,
    origE: new THREE.Color(0x000000), origEI: 0,
    hoverE: new THREE.Color(0xcc3355), hoverEI: 0.04,
    cat: 'That\'s Me!', title: 'Jennifer Flores',
    body: 'UX/UI & Product Designer. I turn complex problems into clean, human-centered experiences — one espresso at a time.',
  },
];

// ── Raycasting & hover ────────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const pointer   = new THREE.Vector2(-9, -9);
const tipEl = document.getElementById('tip');
const tcEl  = document.getElementById('tc');
const ttEl  = document.getElementById('tt');
const tbEl  = document.getElementById('tb');
let activeMesh = null;

window.addEventListener('mousemove', e => {
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  tipEl.style.left = Math.min(e.clientX + 22, innerWidth  - 274) + 'px';
  tipEl.style.top  = Math.min(e.clientY - 8,  innerHeight - 150) + 'px';
});
canvas.addEventListener('mousedown', () => document.body.classList.add('dragging'));
window.addEventListener('mouseup',   () => document.body.classList.remove('dragging'));

const hint  = document.getElementById('hint');
let hinted  = false;
controls.addEventListener('change', () => {
  if (!hinted) { hinted = true; setTimeout(() => hint.classList.add('gone'), 2800); }
});

// ── Render loop ───────────────────────────────────────────────────────────────
const iMeshes = interactives.map(h => h.mesh);

function animate() {
  requestAnimationFrame(animate);
  controls.update();

  // Head tracking — ONLY animation in the room
  figHead.rotation.y += (pointer.x * 0.55 - figHead.rotation.y) * 0.06;
  figHead.rotation.x += (-pointer.y * 0.25 - figHead.rotation.x) * 0.06;

  // Hover detection
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(iMeshes);
  if (hits.length > 0) {
    const found = interactives.find(h => h.mesh === hits[0].object);
    if (found && found.mesh !== activeMesh) {
      if (activeMesh) {
        const prev = interactives.find(h => h.mesh === activeMesh);
        if (prev) { activeMesh.material.emissive.copy(prev.origE); activeMesh.material.emissiveIntensity = prev.origEI; }
      }
      activeMesh = found.mesh;
      activeMesh.material.emissive.copy(found.hoverE);
      activeMesh.material.emissiveIntensity = found.hoverEI;
      tcEl.textContent = found.cat;
      ttEl.textContent = found.title;
      tbEl.textContent = found.body;
      tipEl.classList.add('show');
      document.body.classList.add('hovering');
    }
  } else {
    if (activeMesh) {
      const prev = interactives.find(h => h.mesh === activeMesh);
      if (prev) { activeMesh.material.emissive.copy(prev.origE); activeMesh.material.emissiveIntensity = prev.origEI; }
      activeMesh = null;
    }
    tipEl.classList.remove('show');
    document.body.classList.remove('hovering');
  }

  renderer.render(scene, camera);
}
animate();

// ── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
